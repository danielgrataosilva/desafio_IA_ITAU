observacoes:
  - "O Nível 2 não é declarado totalmente completo porque a execução do Top 10 foi interrompida por quota 429."
  - "O custo monetário não foi fornecido pelo SDK e não foi estimado."
  - "Latência, tokens, retries e erros por chamada são registrados quando disponibilizados pelo SDK; custo monetário permanece indisponível quando não fornecido."
  - "Resultados de modelos diferentes foram mantidos separados."
  - "Groq foi avaliado como contingência, mas não foi promovido ao caminho final; Gemini permanece como provedor/modelo declarado nesta entrega."
